<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nava Arcade</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: system-ui, sans-serif; color: #f8fbff; background: radial-gradient(circle at 50% 0%, #314b9f, #10162f 45%, #060812); }
    header { max-width: 1050px; margin: auto; padding: 28px 22px; display: flex; justify-content: space-between; align-items: center; gap: 14px; }
    h1 { margin: 0; font-size: clamp(1.7rem, 5vw, 3rem); } header p { margin: 4px 0 0; color: #c4d0fa; }
    button { border: 0; border-radius: 10px; padding: 11px 16px; background: #79f4d2; color: #07221a; font: 800 1rem system-ui; cursor: pointer; } button:hover { filter: brightness(1.1); transform: translateY(-1px); }
    #dev { background: #253a78; color: #fff; border: 1px solid #7891e7; }
    main { max-width: 1050px; margin: 10px auto; padding: 0 22px 50px; }
    h2 { margin: 16px 0; } #games { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
    .game { min-height: 215px; padding: 22px; border: 1px solid #526cc0; border-radius: 18px; background: linear-gradient(145deg, #1d2b61, #101735); box-shadow: 0 12px 30px #0005; display: flex; flex-direction: column; }
    .empty { padding: 36px 22px; border: 2px dashed #5065ad; border-radius: 18px; text-align: center; color: #c4d0fa; }
    .game .icon { font-size: 3rem; } .game h3 { margin: 14px 0 6px; } .game p { margin: 0 0 18px; color: #c5d1f8; flex: 1; } .game a { text-decoration: none; text-align: center; }
    dialog { width: min(420px, 92vw); border: 1px solid #7188df; border-radius: 18px; padding: 24px; color: #f8fbff; background: #121b42; box-shadow: 0 20px 70px #000b; } dialog::backdrop { background: #02030aaa; }
    dialog h2 { margin-top: 0; } label { display: block; font-weight: 700; margin: 12px 0 5px; } input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #536ab7; background: #080d23; color: #fff; font: inherit; } .row { display: flex; justify-content: end; gap: 8px; margin-top: 18px; } .cancel { background: #3a4979; color: #fff; } #note { color: #b9c8f5; font-size: .9rem; } #error { color: #ff9cb4; min-height: 1.3em; }
  </style>
</head>
<body>
  <header>
    <div><h1>✦ Nava Arcade</h1><p>Play games made by Nava.</p></div>
    <button id="dev">⚙ Developer</button>
  </header>
  <main>
    <h2>My Games</h2>
    <section id="games"></section>
  </main>

  <dialog id="login"><h2 id="loginTitle">Developer Login</h2><p id="note"></p><label for="password">Password</label><input id="password" type="password" autocomplete="current-password"><label id="confirmLabel" for="confirm">Confirm password</label><input id="confirm" type="password" autocomplete="new-password"><p id="error"></p><div class="row"><button class="cancel" id="cancel">Cancel</button><button id="continue">Continue</button></div></dialog>
  <dialog id="add"><h2>Add a game</h2><p id="note">Put your new game HTML file in this same folder, then type its name and filename below.</p><label for="gameName">Game name</label><input id="gameName" placeholder="My awesome game"><label for="gameFile">Game filename</label><input id="gameFile" placeholder="my-game.html"><div class="row"><button class="cancel" id="closeAdd">Cancel</button><button id="saveGame">Add game</button></div></dialog>

  <script>
    const gamesEl = document.querySelector('#games');
    const savedGames = () => JSON.parse(localStorage.gameHubGames || '[]');
    const developerHash = 'c43934ca8aa05c3f9eb8aed769fc02f13f7f92c1d5196ad7abe4b3f78060462f';
    function render() { const games=savedGames(); gamesEl.innerHTML = games.length ? games.map(game => `<article class="game"><div class="icon">${game.icon || '🎮'}</div><h3>${game.name}</h3><p>${game.description || 'A game made by Anthony.'}</p><a href="${game.file}"><button>Play game</button></a></article>`).join('') : '<div class="empty"><h3>No games yet</h3><p>Click Developer to add your first game.</p></div>'; }
    async function digest(text) { const bytes = new TextEncoder().encode(text); const hash = await crypto.subtle.digest('SHA-256', bytes); return [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2,'0')).join(''); }
    const login = document.querySelector('#login'), add = document.querySelector('#add'), pass = document.querySelector('#password'), confirm = document.querySelector('#confirm'), error = document.querySelector('#error');
    document.querySelector('#dev').onclick = () => { document.querySelector('#loginTitle').textContent = 'Developer Login'; document.querySelector('#note').textContent = 'Enter your developer password to add a game.'; document.querySelector('#confirmLabel').hidden = true; confirm.hidden = true; pass.value = confirm.value = error.textContent = ''; login.showModal(); pass.focus(); };
    document.querySelector('#cancel').onclick = () => login.close();
    document.querySelector('#continue').onclick = async () => { if (!pass.value) { error.textContent = 'Please type a password.'; return; } const hash = await digest(pass.value); if (hash !== developerHash) { error.textContent = 'That password is not right.'; return; } login.close(); add.showModal(); };
    document.querySelector('#closeAdd').onclick = () => add.close();
    document.querySelector('#saveGame').onclick = () => { const name = document.querySelector('#gameName').value.trim(), file = document.querySelector('#gameFile').value.trim(); if (!name || !file) return; const games = savedGames(); games.push({ name, file, icon: '🎮', description: 'A game made by Anthony.' }); localStorage.gameHubGames = JSON.stringify(games); add.close(); render(); };
    render();
  </script>
</body>
</html>
